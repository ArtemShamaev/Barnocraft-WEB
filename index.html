<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0a1418">
<title>Barnocraft WEB</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0a1418; overscroll-behavior: none;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  canvas { position: fixed; inset: 0; display: block; width: 100%; height: 100%; touch-action: none; }
  #text-input { position: fixed; left: 0; top: 0; width: 1px; height: 1px; opacity: 0; border: 0; padding: 0; font-size: 16px; }
  #ui { cursor: default; image-rendering: pixelated; }
  #status { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; padding: 16px;
    color: #e8e3d2; font: 16px/1.5 monospace; text-align: center; background: #0a1418; }
  input[type=file] { display: none; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<canvas id="ui"></canvas>
<div id="status">Загрузка Barnocraft WEB…</div>
<input type="text" id="text-input" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="done">
<input type="file" id="mod-folder" webkitdirectory multiple>
<input type="file" id="mod-file" accept=".py" multiple>
<input type="file" id="world-import" accept=".bcw,.json,.gz">
<script src="js/lib/three.min.js"></script>
<script src="js/core.js"></script>
<script src="js/terrain.js"></script>
<script src="js/player.js"></script>
<script src="js/inventory.js"></script>
<script src="js/modworld.js"></script>
<script src="js/world.js"></script>
<script src="js/mesher.js"></script>
<script src="js/assets.js"></script>
<script src="js/texgen.js"></script>
<script src="js/render.js"></script>
<script src="js/ui.js"></script>
<script src="js/save.js"></script>
<script src="js/net.js"></script>
<script src="js/mods.js"></script>
<script src="js/touch.js"></script>
<script src="js/game.js"></script>
</body>
</html>
